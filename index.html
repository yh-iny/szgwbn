<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>长城宽带网时计算 · 宽带到期日</title>
    <!-- 使用 SF Pro 风格系统字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(ellipse at 20% 20%, #d9e4f5 0%, #c0b8e0 50%, #a8b4d8 100%);
            background-attachment: fixed;
            /* 微妙的动态光晕 */
            position: relative;
            overflow-x: hidden;
        }

        /* 背景装饰光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -20%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(180, 160, 255, 0.20) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 15s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.1);
            }
        }

        /* ===== 主容器 ===== */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        /* ===== 玻璃卡片 ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(32px) saturate(1.3);
            -webkit-backdrop-filter: blur(32px) saturate(1.3);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.08),
                0 8px 24px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(255, 255, 255, 0.2);
            padding: 32px 28px 28px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* 玻璃内层高光 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            pointer-events: none;
            border-radius: 40px;
        }

        /* ===== 标题区域 ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .header-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.06));
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1c1c1e;
            background: linear-gradient(135deg, #1c1c1e 0%, #3a3a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .header p {
            font-size: 15px;
            font-weight: 400;
            color: rgba(60, 60, 80, 0.75);
            letter-spacing: 0.2px;
            margin-top: 2px;
            -webkit-text-fill-color: rgba(60, 60, 80, 0.75);
        }

        /* ===== 分隔线 ===== */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.5), transparent);
            margin: 18px 0 20px;
            position: relative;
            z-index: 1;
        }

        /* ===== 区域标题 ===== */
        .section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(40, 40, 60, 0.8);
            letter-spacing: 0.3px;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }
        .section-label .emoji {
            font-size: 18px;
        }

        /* ===== 表单组 ===== */
        .form-group {
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        .form-group:last-of-type {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(50, 50, 70, 0.8);
            margin-bottom: 5px;
            letter-spacing: 0.2px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-row .form-label {
            margin-bottom: 0;
            flex-shrink: 0;
            min-width: 56px;
        }

        /* ===== 输入框 ===== */
        .input-wrap {
            flex: 1;
            min-width: 120px;
            position: relative;
        }

        .input-wrap input[type="number"],
        .input-wrap input[type="date"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            color: #1c1c1e;
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.50);
            border-radius: 16px;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            appearance: none;
            -webkit-appearance: none;
        }

        .input-wrap input[type="number"]:focus,
        .input-wrap input[type="date"]:focus {
            border-color: rgba(0, 122, 255, 0.50);
            background: rgba(255, 255, 255, 0.70);
            box-shadow: 0 4px 16px rgba(0, 122, 255, 0.12), 0 0 0 3px rgba(0, 122, 255, 0.08);
        }

        .input-wrap input[type="number"] {
            padding-right: 48px;
        }

        .input-wrap .unit {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 500;
            color: rgba(60, 60, 80, 0.5);
            pointer-events: none;
        }

        .input-wrap input[type="date"] {
            color-scheme: light;
            cursor: pointer;
            padding-right: 40px;
            min-height: 50px;
        }

        .input-wrap input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            padding: 4px;
            cursor: pointer;
            filter: invert(0.2);
        }

        /* ===== 快捷按钮 ===== */
        .quick-btn {
            flex-shrink: 0;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: #007aff;
            background: rgba(0, 122, 255, 0.10);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 122, 255, 0.15);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .quick-btn:hover {
            background: rgba(0, 122, 255, 0.18);
            transform: scale(0.97);
        }
        .quick-btn:active {
            transform: scale(0.94);
            background: rgba(0, 122, 255, 0.25);
        }

        /* ===== 暂停时长显示（内联） ===== */
        .pause-display {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.30);
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .pause-display .label {
            font-size: 13px;
            font-weight: 500;
            color: rgba(50, 50, 70, 0.7);
        }
        .pause-display .value {
            font-size: 18px;
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: -0.3px;
            background: rgba(255, 255, 255, 0.30);
            padding: 2px 14px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        .pause-display .value span {
            font-weight: 400;
            font-size: 14px;
            color: rgba(60, 60, 80, 0.6);
            margin: 0 2px;
        }

        .pause-records {
            position: relative;
            z-index: 1;
        }

        .pause-record {
            padding: 14px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 20px;
        }

        .pause-record:last-child {
            margin-bottom: 0;
        }

        .pause-record-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .pause-record-title {
            font-size: 13px;
            font-weight: 600;
            color: rgba(40, 40, 60, 0.75);
        }

        .remove-pause-btn {
            padding: 5px 10px;
            font-size: 12px;
            font-family: inherit;
            color: #d64545;
            background: rgba(214, 69, 69, 0.08);
            border: 1px solid rgba(214, 69, 69, 0.15);
            border-radius: 10px;
            cursor: pointer;
        }

        .pause-record .form-group {
            margin-bottom: 10px;
        }

        .pause-record .form-group:last-child {
            margin-bottom: 0;
        }

        .pause-record .quick-btn {
            padding: 8px 10px;
            font-size: 12px;
        }

        .add-pause-btn {
            width: 100%;
            margin-top: 12px;
        }

        /* ===== 结果区域 ===== */
        .result-area {
            margin-top: 20px;
            padding: 18px 20px 20px;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }

        .result-area .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.20);
        }
        .result-area .result-row:last-child {
            border-bottom: none;
        }

        .result-row .rlabel {
            font-size: 14px;
            font-weight: 500;
            color: rgba(50, 50, 70, 0.7);
        }
        .result-row .rvalue {
            font-size: 15px;
            font-weight: 600;
            color: #1c1c1e;
            text-align: right;
        }

        .result-row.highlight {
            background: linear-gradient(135deg, rgba(0, 122, 255, 0.08), rgba(88, 86, 214, 0.08));
            border-radius: 12px;
            padding: 10px 12px;
            margin: 4px -6px;
            border-bottom: none;
        }
        .result-row.highlight .rlabel {
            color: rgba(0, 80, 200, 0.8);
            font-weight: 600;
        }
        .result-row.highlight .rvalue {
            font-size: 20px;
            font-weight: 700;
            color: #007aff;
            letter-spacing: -0.3px;
        }

        .result-row .badge {
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            background: #007aff;
            padding: 2px 12px;
            border-radius: 30px;
            letter-spacing: 0.3px;
            margin-left: 8px;
        }

        /* ===== 底部 ===== */
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: rgba(60, 60, 80, 0.40);
            margin-top: 18px;
            position: relative;
            z-index: 1;
            letter-spacing: 0.2px;
        }

        /* ===== 空状态 ===== */
        .empty-hint {
            color: rgba(60, 60, 80, 0.35);
            font-size: 14px;
            font-weight: 400;
            text-align: center;
            padding: 12px 0 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .glass-card {
                padding: 24px 18px 20px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 24px;
            }
            .header-icon {
                font-size: 34px;
            }
            .form-row {
                gap: 6px;
            }
            .input-wrap input[type="number"],
            .input-wrap input[type="date"] {
                padding: 10px 14px;
                font-size: 15px;
                min-height: 44px;
            }
            .quick-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
            .pause-display .value {
                font-size: 16px;
                padding: 2px 12px;
            }
            .result-row.highlight .rvalue {
                font-size: 18px;
            }
            .result-area {
                padding: 14px 14px 16px;
            }
        }

        @media (max-width: 380px) {
            .glass-card {
                padding: 18px 12px 16px;
            }
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }
            .form-row .form-label {
                min-width: auto;
            }
            .input-wrap {
                min-width: auto;
            }
            .quick-btn {
                align-self: flex-start;
            }
            .pause-display {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* ===== 工具类 ===== */
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 14px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gap-2 {
            gap: 8px;
        }
        .text-muted {
            color: rgba(60, 60, 80, 0.5);
        }

        /* ===== 动画 ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-area {
            animation: fadeUp 0.5s ease-out;
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 122, 255, 0.3);
            border-radius: 10px;
        }

        /* ===== 日期输入框自定义图标 ===== */
        .input-wrap input[type="date"]::-webkit-datetime-edit {
            color: #1c1c1e;
        }
        .input-wrap input[type="date"]::-webkit-datetime-edit-fields-wrapper {
            color: #1c1c1e;
        }
        .input-wrap input[type="date"]::-webkit-datetime-edit-text {
            color: rgba(60, 60, 80, 0.4);
        }
        .input-wrap input[type="date"]::-webkit-datetime-edit-month-field,
        .input-wrap input[type="date"]::-webkit-datetime-edit-day-field,
        .input-wrap input[type="date"]::-webkit-datetime-edit-year-field {
            color: #1c1c1e;
        }

        /* 防止 iOS 自动缩放 */
        input {
            font-size: 16px !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ===== 主卡片 ===== -->
        <div class="glass-card">

            <!-- 头部 -->
            <div class="header">
                <span class="header-icon">📡</span>
                <h1>长城宽带</h1>
                <p>宽带暂停补偿</p>
            </div>

            <!-- ===== 套餐时常 ===== -->
            <div class="section-label">
                <span class="emoji">📋</span> 套餐时常

            </div>

            <div class="form-group">
                <div class="form-row">
                    <span class="form-label">套餐月数</span>
                    <div class="input-wrap">
                        <input type="number" id="planMonths" value="0" min="0" max="120" step="1" />
                        <span class="unit">月</span>
                    </div>
                    <button class="quick-btn" id="resetPlanBtn" type="button">重置</button>
                </div>
            </div>

            <div class="form-group">
                <div class="form-row">
                    <span class="form-label">开通日期</span>
                    <div class="input-wrap">
                        <input type="date" id="startDate" />
                    </div>
                    <button class="quick-btn" id="todayBtn">今天</button>
                </div>
            </div>

            <div class="divider"></div>

            <!-- ===== 暂停信息 ===== -->
            <div class="section-label">
                <span class="emoji">⏸️</span> 暂停信息
            </div>

            <div class="pause-records" id="pauseRecords"></div>
            <button class="quick-btn add-pause-btn" id="addPauseBtn" type="button">＋ 添加一次暂停</button>

            <!-- 暂停时长显示 -->
            <div class="pause-display" id="pauseDurationDisplay">
                <span class="label">⏱️ 暂停时长</span>
                <span class="value" id="pauseDurationValue">—</span>
            </div>

            <div class="divider"></div>

            <!-- ===== 计算结果 ===== -->
            <div class="section-label">
                <span class="emoji">📊</span> 计算结果
            </div>

            <div class="result-area" id="resultArea">
                <div class="result-row">
                    <span class="rlabel">正常到期日</span>
                    <span class="rvalue" id="normalEnd">—</span>
                </div>
                <div class="result-row highlight">
                    <span class="rlabel">✨ 补偿到期日</span>
                    <span class="rvalue" id="compensatedEnd">—</span>
                </div>
                <div class="result-row">
                    <span class="rlabel">补偿天数</span>
                    <span class="rvalue" id="compensatedDays">—</span>
                </div>
                <div class="result-row" style="border-bottom: none; padding-bottom: 0;">
                    <span class="rlabel">总服务月数</span>
                    <span class="rvalue" id="totalMonths">—</span>
                </div>
            </div>

            <div class="footer-note">
                自动计算 · 实时更新
            </div>

        </div>
        <!-- /主卡片 -->
    </div>

    <script>
        // ============================================================
        //  DOM 引用
        // ============================================================
        const planMonthsInput = document.getElementById('planMonths');
        const startDateInput = document.getElementById('startDate');
        const pauseRecords = document.getElementById('pauseRecords');
        const addPauseBtn = document.getElementById('addPauseBtn');

        const pauseDurationValue = document.getElementById('pauseDurationValue');
        const normalEndEl = document.getElementById('normalEnd');
        const compensatedEndEl = document.getElementById('compensatedEnd');
        const compensatedDaysEl = document.getElementById('compensatedDays');
        const totalMonthsEl = document.getElementById('totalMonths');

        const todayBtn = document.getElementById('todayBtn');
        const resetPlanBtn = document.getElementById('resetPlanBtn');

        // ============================================================
        //  工具函数
        // ============================================================

        /** 格式化日期为 YYYY年MM月DD日 */
        function formatDate(date) {
            if (!date || isNaN(date.getTime())) return '—';
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}年${m}月${d}日`;
        }

        /** 获取今天的日期对象（时间归零） */
        function getToday() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d;
        }

        /** 解析 input[type="date"] 的值 → Date 对象（时间归零） */
        function parseDateInput(val) {
            if (!val) return null;
            const parts = val.split('-');
            if (parts.length !== 3) return null;
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            d.setHours(0, 0, 0, 0);
            return isNaN(d.getTime()) ? null : d;
        }

        /** Date 对象 → YYYY-MM-DD 字符串 */
        function toDateInputValue(date) {
            if (!date || isNaN(date.getTime())) return '';
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        /** 计算两个日期之间的差值（月 + 天），精确到自然月 */
        function diffMonthsDays(date1, date2) {
            // date1 < date2，返回 { months, days }
            if (!date1 || !date2 || isNaN(date1.getTime()) || isNaN(date2.getTime())) {
                return { months: 0, days: 0 };
            }
            if (date1 > date2) {
                // 交换
                const tmp = date1;
                date1 = date2;
                date2 = tmp;
            }

            let years = date2.getFullYear() - date1.getFullYear();
            let months = date2.getMonth() - date1.getMonth();
            let days = date2.getDate() - date1.getDate();

            // 处理天数负数：借位
            if (days < 0) {
                months--;
                // 获取 date2 所在月份的上一个月最后一天
                const prevMonth = new Date(date2.getFullYear(), date2.getMonth(), 0);
                days += prevMonth.getDate();
            }

            // 处理月份负数：借位
            if (months < 0) {
                years--;
                months += 12;
            }

            const totalMonths = years * 12 + months;
            return { months: totalMonths, days: days };
        }

        /** 日期加上 N 个月 + M 天 */
        function addMonthsDays(date, months, days) {
            if (!date || isNaN(date.getTime())) return null;
            const result = new Date(date);
            // 先加月份
            result.setMonth(result.getMonth() + months);
            // 再加天数
            result.setDate(result.getDate() + days);
            return result;
        }

        /** 计算两个日期之间的总天数 */
        function diffDays(date1, date2) {
            if (!date1 || !date2 || isNaN(date1.getTime()) || isNaN(date2.getTime())) return 0;
            const t1 = new Date(date1.getFullYear(), date1.getMonth(), date1.getDate());
            const t2 = new Date(date2.getFullYear(), date2.getMonth(), date2.getDate());
            return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
        }

        /** 创建一条可编辑的暂停记录 */
        function addPauseRecord(startValue = '', endValue = '') {
            const record = document.createElement('div');
            const recordNumber = pauseRecords.children.length + 1;
            record.className = 'pause-record';
            record.innerHTML = `
                <div class="pause-record-header">
                    <span class="pause-record-title">第${recordNumber}次暂停</span>
                    <button class="remove-pause-btn" type="button">删除</button>
                </div>
                <div class="form-group">
                    <div class="form-row">
                        <span class="form-label">暂停开始</span>
                        <div class="input-wrap">
                            <input type="date" class="pause-start" value="${startValue}" />
                        </div>
                        <button class="quick-btn pause-start-today" type="button">今天</button>
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-row">
                        <span class="form-label">复机时间</span>
                        <div class="input-wrap">
                            <input type="date" class="pause-end" value="${endValue}" />
                        </div>
                        <button class="quick-btn pause-end-today" type="button">今天</button>
                    </div>
                </div>`;

            record.querySelectorAll('input').forEach(input => {
                input.addEventListener('change', calculate);
            });
            record.querySelector('.remove-pause-btn').addEventListener('click', function() {
                if (pauseRecords.children.length > 1) {
                    record.remove();
                    updatePauseRecordTitles();
                    calculate();
                }
            });
            record.querySelector('.pause-start-today').addEventListener('click', function() {
                record.querySelector('.pause-start').value = toDateInputValue(getToday());
                calculate();
            });
            record.querySelector('.pause-end-today').addEventListener('click', function() {
                record.querySelector('.pause-end').value = toDateInputValue(getToday());
                calculate();
            });
            pauseRecords.appendChild(record);
        }

        function updatePauseRecordTitles() {
            pauseRecords.querySelectorAll('.pause-record-title').forEach((title, index) => {
                title.textContent = `第${index + 1}次暂停`;
            });
        }

        // ============================================================
        //  核心计算
        // ============================================================

        function calculate() {
            // 1. 读取输入
            const parsedPlanMonths = parseInt(planMonthsInput.value, 10);
            const planMonths = Number.isNaN(parsedPlanMonths) ? 0 : Math.max(0, parsedPlanMonths);
            const startDate = parseDateInput(startDateInput.value);

            // 2. 如果没有开通日期，用今天
            if (!startDate) {
                const today = getToday();
                startDateInput.value = toDateInputValue(today);
                return calculate(); // 递归重新计算
            }

            // 3. 计算暂停时长
            let pauseMonths = 0;
            let pauseDays = 0;
            let pauseTotalDays = 0;
            let validPauseCount = 0;

            pauseRecords.querySelectorAll('.pause-record').forEach(record => {
                const pauseStart = parseDateInput(record.querySelector('.pause-start').value);
                const pauseEnd = parseDateInput(record.querySelector('.pause-end').value);
                if (pauseStart && pauseEnd && pauseStart < pauseEnd) {
                    const diff = diffMonthsDays(pauseStart, pauseEnd);
                    pauseMonths += diff.months;
                    pauseDays += diff.days;
                    pauseTotalDays += diffDays(pauseStart, pauseEnd);
                    validPauseCount++;
                }
            });

            // 将累计的零散天数进位为月，保持到期日计算与总天数一致。
            const extraMonths = Math.floor(pauseDays / 30);
            pauseMonths += extraMonths;
            pauseDays %= 30;

            // 4. 正常到期日（无暂停）
            const normalEnd = addMonthsDays(startDate, planMonths, 0);

            // 5. 补偿到期日 = 正常到期日 + 暂停时长
            const compensatedEnd = addMonthsDays(normalEnd, pauseMonths, pauseDays);

            // 6. 计算补偿天数（总暂停天数）
            const compensatedDays = pauseTotalDays;

            // 7. 总服务月数（含补偿）
            const totalMonths = planMonths + pauseMonths + (pauseDays > 0 ? 1 : 0); // 粗略，实际用天换算
            // 更精确：总服务月数 = 套餐月数 + 暂停月数 + 暂停天数/30（近似）
            const totalMonthsExact = planMonths + pauseMonths + (pauseDays / 30);

            // 8. 更新 UI
            // 暂停时长显示
            if (validPauseCount > 0) {
                let parts = [];
                if (pauseMonths > 0) parts.push(`${pauseMonths}个月`);
                if (pauseDays > 0) parts.push(`${pauseDays}天`);
                if (parts.length === 0) parts.push('0天');
                pauseDurationValue.textContent = parts.join(' ');
                // 如果暂停时长 > 0，加一个高亮
                if (pauseMonths > 0 || pauseDays > 0) {
                    pauseDurationValue.style.color = '#007aff';
                } else {
                    pauseDurationValue.style.color = '#1c1c1e';
                }
            } else {
                pauseDurationValue.textContent = '—';
                pauseDurationValue.style.color = '#1c1c1e';
            }

            // 正常到期日
            normalEndEl.textContent = formatDate(normalEnd);

            // 补偿到期日
            compensatedEndEl.textContent = formatDate(compensatedEnd);

            // 补偿天数
            if (compensatedDays > 0) {
                compensatedDaysEl.textContent = `${compensatedDays} 天`;
                compensatedDaysEl.style.color = '#007aff';
            } else {
                compensatedDaysEl.textContent = '—';
                compensatedDaysEl.style.color = '#1c1c1e';
            }

            // 总服务月数
            if (planMonths > 0) {
                const total = planMonths + pauseMonths + (pauseDays > 0 ? pauseDays / 30 : 0);
                totalMonthsEl.textContent = `${total.toFixed(1)} 个月`;
            } else {
                totalMonthsEl.textContent = '—';
            }

            // 高亮显示补偿差异
            if (compensatedDays > 0) {
                compensatedEndEl.style.color = '#007aff';
                compensatedEndEl.style.fontWeight = '700';
            } else {
                compensatedEndEl.style.color = '#1c1c1e';
                compensatedEndEl.style.fontWeight = '600';
            }
        }

        // ============================================================
        //  事件绑定
        // ============================================================

        // 所有输入变化时重新计算
        planMonthsInput.addEventListener('input', calculate);
        startDateInput.addEventListener('change', calculate);

        // 支持实时输入
        planMonthsInput.addEventListener('change', calculate);

        resetPlanBtn.addEventListener('click', function() {
            window.location.reload();
        });

        // "今天" 按钮
        todayBtn.addEventListener('click', function() {
            const today = getToday();
            startDateInput.value = toDateInputValue(today);
            calculate();
        });

        addPauseBtn.addEventListener('click', function() {
            addPauseRecord();
            calculate();
        });

        // ============================================================
        //  初始化
        // ============================================================

        (function init() {
            const today = getToday();

            // 默认开通日期 = 今天
            startDateInput.value = toDateInputValue(today);

            // 默认添加一条空白暂停记录，由用户填写暂停开始和复机日期
            addPauseRecord();

            // 执行首次计算
            calculate();
        })();

        // 页面可见性变化时重新计算（防止日期变化）
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                calculate();
            }
        });

        // 窗口大小变化时，重新计算（确保显示正确）
        window.addEventListener('resize', function() {
            // 仅做 UI 刷新，无需重新计算
        });

        console.log('📡 网时计算 · 已加载');
        console.log('💡 提示：选择开通日期和暂停区间，自动计算补偿到期日');
    </script>
</body>
</html>
